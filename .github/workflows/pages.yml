name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages sites built from private repos are still publicly reachable —
    # never deploy before the repo itself is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the docs site
        # website/ is a self-contained npm project, so the library's own
        # package.json stays free of Astro. Its `base` is /sorta11y/docs, which
        # must match where the artifact mounts it below.
        run: npm ci && npm run build
        working-directory: website
      - name: Assemble Pages artifact (site + demo + docs + library source)
        # Same script `npm run preview` uses locally, so the preview is a real
        # test of this layout rather than an approximation of it.
        run: sh scripts/assemble-pages.sh _pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
