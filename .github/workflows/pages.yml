name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages sites built from private repos are still publicly reachable —
    # never deploy before the repo itself is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Astro requires Node >= 22.12 (see website/package.json engines).
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the docs site
        # website/ is a self-contained npm project, so the library's own
        # package.json stays free of Astro. Its `base` is /sorta11y/docs, which
        # must match where the artifact mounts it below.
        run: npm ci && npm run build
        working-directory: website
      - name: Assemble Pages artifact (site + demo + docs + library source)
        # Same script `npm run preview` uses locally, so the preview is a real
        # test of this layout rather than an approximation of it.
        run: sh scripts/assemble-pages.sh _pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
