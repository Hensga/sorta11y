name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages sites built from private repos are still publicly reachable —
    # never deploy before the repo itself is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Astro requires Node >= 22.12 (see website/package.json engines).
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the docs site
        # website/ is a self-contained npm project, so the library's own
        # package.json stays free of Astro. Its `base` is /sorta11y/docs, which
        # must match where the artifact mounts it below.
        run: npm ci && npm run build
        working-directory: website
      - name: Assemble Pages artifact (site + demo + docs + library source)
        # Same script `npm run preview` uses locally, so the preview is a real
        # test of this layout rather than an approximation of it.
        run: sh scripts/assemble-pages.sh _pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
