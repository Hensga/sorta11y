name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repo; keep the token read-only regardless of the
# repository's default workflow permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The dev tooling (vitest 5, jsdom 30) needs Node 22.22+ / 24.15+;
        # Node 20 is end-of-life. The library itself only runs in browsers.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: npm run format:check

  docs:
    # Build the docs site too, so a /website dependency bump (Dependabot) that
    # breaks the Astro build fails here, not in the Pages deploy.
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci && npm run build
        working-directory: website
